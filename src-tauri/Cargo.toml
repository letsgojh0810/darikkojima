[package]
name = "darikkojima"
version = "0.2.7"
description = "한국 직장인을 위한 데스크탑 펫 리마인더"
authors = ["hanjh"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "darikkojima_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2.5.0"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-http = "2.8.3"
tauri-plugin-updater = "2.14.0"
tauri-plugin-opener = "2"

# Windows only: fullscreen / presentation detection (src/fullscreen.rs), last input time (src/idle.rs)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"] }
# macOS's transparent window needs tauri's "macos-private-api" feature; it is not listed here on purpose: the Tauri CLI
# turns it on by itself for Mac builds (from app.macOSPrivateApi in tauri.macos.conf.json) and would strip it again on
# every Windows build.

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
